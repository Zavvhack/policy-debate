<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Blue for the affirmative, red for the negative, split like the two sides of a flow. -->
  <defs><clipPath id="r"><rect x="64" y="64" width="896" height="896" rx="200"/></clipPath></defs>
  <g clip-path="url(#r)">
    <rect x="64" y="64" width="896" height="896" fill="#1556c2"/>
    <polygon points="960,64 960,960 64,960" fill="#c2222f"/>
  </g>
  <text x="512" y="610" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="700" font-size="400" fill="#ffffff" letter-spacing="-10">PD</text>
</svg>
